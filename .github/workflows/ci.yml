name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The web app's typed client is generated from this document; it must match the API.
      - name: Check the API description is current
        run: |
          dotnet build src/SyncBingo.Api --no-restore --configuration Release -p:OpenApiGenerateDocuments=true
          git diff --exit-code web/src/api/openapi.json || { echo "Run 'npm run api:generate' in web/ and commit."; exit 1; }

  web:
    name: Web lint, typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the API types match the API description
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || { echo "Run 'npm run api:types' in web/ and commit."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both CPU architectures (ADR 0011): build stages run natively, runtime stages only copy files, so no
      # emulation is needed. The GitHub Actions cache keeps this job well under its 2-minute budget.
      - uses: docker/setup-buildx-action@v4

      - name: API image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SyncBingo.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Compose file is valid
        run: docker compose config --quiet
