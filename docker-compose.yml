# Local stack: docker compose up --build, then open http://localhost:8080

services:
  web:
    build:
      context: web
    ports:
      - "8080:8080"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: src/SyncBingo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: valkey:6379
    ports:
      - "5080:8080" # direct access for debugging, e.g. http://localhost:5080/healthz
    depends_on:
      valkey:
        condition: service_healthy

  # Valkey: the open-source, Redis-compatible store (ADR 0011); 8.x, as on ElastiCache.
  valkey:
    image: docker.io/valkey/valkey:8.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
