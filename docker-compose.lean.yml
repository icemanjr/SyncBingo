# The live site (Lean profile, ADR 0011, docs/07 §1a): one small instance runs this file.
#
#   SITE_DOMAIN=syncbingo.com docker compose -f docker-compose.lean.yml up -d
#
# Without SITE_DOMAIN it serves https://localhost (Caddy's own local certificate), to try it on a laptop;
# rootless Podman can't bind 80 and 443, so add HTTP_PORT=8080 HTTPS_PORT=8443 PUBLIC_ORIGIN=https://localhost:8443.
# Images: CI publishes them to GHCR after each merge; deploy/update.sh pulls them nightly (docs/07 §1a).
# To build them here instead, add --build.

name: syncbingo

services:
  caddy:
    image: ghcr.io/icemanjr/syncbingo-web-caddy:${IMAGE_TAG:-latest}
    build:
      context: web
      target: caddy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # certificates: keep them, or Let's Encrypt's rate limits bite after a few rebuilds
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" } # a small disk: cap the logs

  api:
    image: ghcr.io/icemanjr/syncbingo-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/SyncBingo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: valkey:6379
      Web__PublicOrigin: ${PUBLIC_ORIGIN:-https://${SITE_DOMAIN:-localhost}} # join and display links
      ForwardedHeaders__Enabled: "true" # Caddy passes each client's address on, for the rate limits
    # No published port: only Caddy reaches the API.
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Append-only file on a volume, so live games survive API restarts, deploys and reboots (ADR 0011).
  # Every key has a TTL; if memory still fills up, new writes fail (new games are refused) rather than
  # evicting a live game. 256 MB is a first guess until bytes per game are measured (docs/10).
  valkey:
    image: docker.io/valkey/valkey:8.1-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  valkey_data:
